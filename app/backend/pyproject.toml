[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2,<3",
    "pydantic-settings",
    "uvicorn[standard]",
    "websockets",
    "wsproto",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "data*",
    "tests*",
    "tmp*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
